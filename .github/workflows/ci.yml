name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scaffold:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whitespace
        shell: bash
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD

      - name: Check scaffold and tracked file boundaries
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          required = [
              'README.md', 'LICENSE', 'AGENTS.md', 'CONTRIBUTING.md',
              'SECURITY.md', '.gitignore', '.coderabbit.yaml', 'Domains/LICENSE',
              'docs/paymenter-extension-conventions.md', 'docs/testing.md',
          ]
          for name in required:
              assert Path(name).is_file(), f'Missing required file: {name}'
          license_text = Path('LICENSE').read_text()
          assert license_text.startswith('MIT License\n'), 'Expected MIT license'
          assert Path('Domains/LICENSE').read_text() == license_text, 'License copies differ'

          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          private_dirs = {'.local', '.scratch', '.cache', 'private', 'backups', 'node_modules', 'vendor', 'dist', '__pycache__'}
          for name in filter(None, paths):
              path = Path(name)
              assert not private_dirs.intersection(path.parts[:-1]), f'Private/build path tracked: {name}'
              assert not (path.name == '.env' or (path.name.startswith('.env.') and path.name != '.env.example')), f'Environment file tracked: {name}'
              assert not path.name.endswith(('.pem', '.key', '.sql', '.sqlite', '.cnf', '.private')), f'Private file tracked: {name}'
              assert '.private.' not in path.name, f'Private file tracked: {name}'
          print('Repository hygiene passed.')

  offline:
    name: Offline PHP suites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install runtime system libraries
        run: sudo apt-get update && sudo apt-get install -y libxml2 libargon2-1 libsodium23 libcurl4t64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .cache/php-runtime/*.deb
          key: namesilo-php-${{ runner.os }}-${{ hashFiles('scripts/php-runtime-packages.json') }}
      - run: python3 scripts/bootstrap.py --download
      - run: scripts/test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: offline-test-failures
          path: /tmp/namesilo-tests-*
          include-hidden-files: true
          if-no-files-found: ignore
