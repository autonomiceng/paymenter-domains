# CodeRabbit configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be direct and specific. Use plain, industry-standard language. Point to the exact line and suggest a concrete fix."
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Pull requests are stacked: each one targets the branch below it, not only main.
    base_branches:
      - ".*"
  path_filters:
    - "!.local/**"
    - "!.scratch/**"
    - "!dist/**"
    - "!**/*.zip"
  path_instructions:
    - path: "**"
      instructions: |
        This is a public open-source repository. Flag anything that should not be public:
        credentials, tokens, private keys, real hostnames, IP addresses, server paths,
        database names, personal email addresses, or customer data. Examples and test data
        must use reserved example names (example.com, example.net, example.org, *.example,
        *.test), documentation IP ranges, and placeholder values.
        Exception: single-label <label>-placeholder.com names (including numbered placeholder
        variants) are allowed where a test needs distinct .com second-level names, as enforced
        by tests/fixture-policy-test.php. Offline tests only; no DNS or availability lookups.
        Public-only network tests may use 8.8.8.8 where non-global addresses are refused, and tests
        may use production constants the code matches (the IANA bootstrap URL, Enom default nameservers and
        registrar API endpoints). Glue fixtures use public addresses because glue refuses documentation ranges.
    - path: "NameSilo/**"
      instructions: |
        Paymenter domain registrar extension (Laravel/PHP) for the NameSilo registrar API. Check
        authorization, input validation, idempotent order and renewal handling, correct money
        and currency math, safe retries, and that API credentials never reach logs or views.
    - path: "NameSilo/**/*.blade.php"
      instructions: |
        Check escaping of user and API data, accessibility (labels, contrast, keyboard use),
        and clear, plain UI text.
    - path: "tests/**"
      instructions: |
        Check that tests assert real behavior and cover failure paths, not only the happy path.
chat:
  auto_reply: true
